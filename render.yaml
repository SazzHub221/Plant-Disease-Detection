services:
  # Frontend web service (React app)
  - type: web
    name: plant-disease-frontend
    runtime: static
    buildCommand: bash ./deploy.sh
    staticPublishPath: ./build
    envVars:
      - key: NODE_OPTIONS
        value: --openssl-legacy-provider
      - key: REACT_APP_API_URL
        value: https://plant-disease-detection-yz5v.onrender.com/predict
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

